# Render Blueprint — automatsko podešavanje servisa
# Korištenje: push kod na GitHub → Render Dashboard → New + → Blueprint → izaberi repo → Apply
# (Blueprint sam kreira web servis, disk i varijable — ne trebaš ništa ručno kliktati)
services:
  - type: web
    name: kviz-matura
    runtime: node
    plan: starter            # plaćeni plan — OBAVEZAN za persistent disk (baza!)
    region: frankfurt        # najbliži region Bosni i Hercegovini
    disk:
      name: kviz-baza
      mountPath: /data       # ovdje živi SQLite fajl — preživljava redeploy i restart
      sizeGB: 1
    buildCommand: npx prisma generate && npm run db:push && npm run seed && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        value: file:/data/custom.db
      - key: AUTH_SECRET
        generateValue: true  # Render sam generiše dugi nasumični tajni ključ
      - key: NODE_VERSION
        value: "22"
